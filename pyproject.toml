[project]
name = "resumatch"
version = "0.1.0"
description = "A semantic CV and job description matching engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pypdf>=3.0.0",
    "typing-extensions>=4.5.0",
]

[project.scripts]
resumatch = "resumatch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["resumatch"]