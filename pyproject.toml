[project]
name = "resumatch"
version = "0.1.0"
description = "A semantic CV and job description matching engine"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pypdf>=3.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
]