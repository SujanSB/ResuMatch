[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumatch"
version = "0.1.0"
description = "A semantic CV and job description matching, recommendation and visualization engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pypdf>=3.0.0",
    "typing-extensions>=4.5.0",
    "kagglehub>=1.0.2",
    "markdownify>=1.2.3",
    "fpdf>=1.7.2",
    "python-docx>=1.2.0",
    "wordcloud>=1.9.6",
    "pytest>=9.1.1",
]

[project.scripts]
resumatch = "resumatch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["resumatch"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
